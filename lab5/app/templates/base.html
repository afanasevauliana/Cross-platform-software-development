<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Новостной портал{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block scripts %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <h1>Новостной портал</h1>
        <p>Главные события города, экономики и культуры</p>
    </header>

    <nav class="navigation">
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('economics') }}">Экономика</a>
        <a href="{{ url_for('culture') }}">Культура</a>
        <a href="{{ url_for('add_news') }}">Добавить новость</a>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Новостной портал 2026</p>
    </footer>
</body>
</html>
